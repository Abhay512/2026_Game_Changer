# Server deploy.
#   docker compose build
#   docker compose run --rm ingest        # build / refresh the Parquet store from the raw CSVs
#   docker compose up -d analyser         # serve on http://<host>:${PORT:-8000}
# Set APP_PASSWORD in .env to require a login (a login page asks for that password).
services:
  analyser:
    build: .
    image: stock-analyser:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_PASSWORD: "${APP_PASSWORD:-}"
      LOGIN_IDLE_MINUTES: "${LOGIN_IDLE_MINUTES:-30}"
      # optional: download the store from a GitHub release instead of running ingest
      DATA_RELEASE: "${DATA_RELEASE:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      WORKERS: "${WORKERS:-2}"
      CACHE_SYMBOLS: "${CACHE_SYMBOLS:-24}"
      CACHE_EXPIRIES: "${CACHE_EXPIRIES:-12}"
      CACHE_RESPONSES: "${CACHE_RESPONSES:-512}"
    volumes:
      - "${STORE_HOST_DIR:-./store}:/data/store"
    # ingest runs as a separate one-off job (below) that writes the same store directory

  ingest:
    image: stock-analyser:latest
    profiles: ["tools"]
    command: ["python", "-m", "ingest"]
    environment:
      INGEST_WORKERS: "${INGEST_WORKERS:-0}"
    volumes:
      - "${RAW_HOST_DIR:-./h2_2025/h2_2025}:/data/raw:ro"
      - "${STORE_HOST_DIR:-./store}:/data/store"
